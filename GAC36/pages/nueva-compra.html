<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Compra - GastroControl360</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <div class="sidebar" id="sidebar-nav">
        <h2>GastroControl360</h2>
        <a href="../dashboard.html">Dashboard</a>
        <a href="catalogo-insumos.html">Catálogo Insumos</a>
        <a href="catalogo-ventas.html">Catálogo Platillos</a>
        <a href="compras.html" class="active">Compras</a>
        <a href="inventario.html">Inventario</a>
        <a href="venta.html">Punto de Venta</a>
        <a href="reportes.html">Reportes</a>
        <a href="configuracion.html">Configuración</a>
    </div>
    
    <div class="main-content">
        <h1>Registrar Nueva Compra</h1>
        <div class="card">
            <h3>Datos Generales del Proveedor</h3>
            <div class="grid-3">
                <div class="form-group">
                    <label>Nombre Proveedor</label>
                    <input type="text" id="compra-proveedor" class="form-control" placeholder="Ej. Avícola">
                </div>
                <div class="form-group">
                    <label>Fecha de Entrada</label>
                    <input type="date" id="compra-fecha" class="form-control">
                </div>
                <div class="form-group">
                    <label>N° Comprobante</label>
                    <input type="text" id="compra-documento" class="form-control" placeholder="Ej. F001-00045">
                </div>
            </div>
        </div>
        <div class="grid-2" style="grid-template-columns: 1fr 1.2fr;">
            <div class="card">
                <h3>Agregar Insumo al Detalle</h3>
                <form id="form-item-compra">
                    <div class="form-group">
                        <label>Seleccionar Insumo</label>
                        <select id="item-insumo-id" class="form-control"></select>
                    </div>
                    <div class="form-group">
                        <label>Cantidad Adquirida</label>
                        <input type="number" id="item-cantidad" class="form-control" step="0.01" value="0">
                    </div>
                    <div class="form-group">
                        <label>Costo Total del Item (S/.)</label>
                        <input type="number" id="item-costo-total" class="form-control" step="0.01" value="0">
                    </div>
                    <button type="submit" class="btn btn-dark" style="width:100%;">Agregar a la Lista</button>
                </form>
            </div>
            <div class="card">
                <h3>Detalle de la Compra</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Insumo</th>
                            <th>Cant.</th>
                            <th>Costo U.</th>
                            <th>Total Item</th>
                            <th>Quitar</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-temporal-compra"></tbody>
                </table>
                <div class="text-right" style="margin-top:20px; font-size:16px; font-weight:600;">
                    TOTAL COMPRA: <span id="compra-total-calculado" style="color:#2E7D32; font-size:22px;">S/. 0.00</span>
                </div>
                <div style="margin-top:20px;" class="text-right">
                    <button id="btn-guardar-compra" class="btn btn-primary" style="width:100%;">PROCESAR Y ACTUALIZAR INVENTARIO</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/database.js"></script>
    <script src="../js/compras.js"></script>
</body>
</html>
