<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Compras - GastroControl360</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <div class="sidebar" id="sidebar-nav">
        <h2>GastroControl360</h2>
        <a href="../dashboard.html">Dashboard</a>
        <a href="catalogo-insumos.html">Catálogo Insumos</a>
        <a href="catalogo-ventas.html">Catálogo Platillos</a>
        <a href="compras.html" class="active">Compras</a>
        <a href="inventario.html">Inventario</a>
        <a href="venta.html">Punto de Venta</a>
        <a href="reportes.html">Reportes</a>
        <a href="configuracion.html">Configuración</a>
    </div>
    
    <div class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1>Historial de Compras</h1>
            <a href="nueva-compra.html" class="btn btn-primary">Registrar Compra</a>
        </div>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Código Compra</th>
                        <th>Fecha</th>
                        <th>Proveedor</th>
                        <th>Nro. Documento</th>
                        <th>Monto Total</th>
                    </tr>
                </thead>
                <tbody id="tabla-historial-compras"></tbody>
            </table>
        </div>
    </div>
    <script src="../js/database.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tbody = document.getElementById("tabla-historial-compras");
            tbody.innerHTML = "";
            if(database.compras.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No se han registrado compras aún.</td></tr>";
                return;
            }
            database.compras.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${c.codigo}</b></td>
                        <td>${c.fecha}</td>
                        <td>${c.proveedor}</td>
                        <td>${c.documento || 'Sin Comprobante'}</td>
                        <td style="font-weight:600;">S/. ${c.total.toFixed(2)}</td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
