<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Insumo - GastroControl360</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <div class="sidebar" id="sidebar-nav"></div>
    
    <div class="main-content">
        <h1>Ficha Técnica del Insumo</h1>
        
        <div class="card">
            <h3>Seleccionar Insumo para Inspección</h3>
            <div class="form-group">
                <label>Insumos del Almacén</label>
                <select id="producto-selector" class="form-control">
                    <option value="">-- Seleccione un insumo --</option>
                </select>
            </div>
        </div>

        <div id="producto-detalle-tarjeta" class="grid-2" style="display: none;">
            <div class="card">
                <h3>Datos de Gestión Actual</h3>
                <div class="form-group">
                    <label>Código Automático</label>
                    <input type="text" id="prod-codigo" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="prod-nombre" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label>Unidad de Medida</label>
                    <input type="text" id="prod-unidad" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label>Stock Físico Real</label>
                    <input type="text" id="prod-stock" class="form-control" readonly style="font-weight: 600; color: #2E7D32;">
                </div>
                <div class="form-group">
                    <label>Costo Promedio Ponderado (S/.)</label>
                    <input type="text" id="prod-costo" class="form-control" readonly style="font-weight: 600; color: #D32F2F;">
                </div>
            </div>

            <div class="card">
                <h3>Historial de Movimientos Recientes</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Cant.</th>
                            <th>Costo T.</th>
                        </tr>
                    </thead>
                    <tbody id="prod-tabla-movimientos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/database.js"></script>
    <script src="../js/app.js"></script>
    <script>
        // Lógica simplificada integrada para evitar archivos js/producto.js huérfanos
        document.addEventListener("DOMContentLoaded", () => {
            const selector = document.getElementById("producto-selector");
            const tarjeta = document.getElementById("producto-detalle-tarjeta");

            database.insumos.forEach(ins => {
                selector.innerHTML += `<option value="${ins.codigo}">${ins.nombre} (${ins.codigo})</option>`;
            });

            selector.addEventListener("change", () => {
                const cod = selector.value;
                if(!cod) { tarjeta.style.display = "none"; return; }
                
                tarjeta.style.display = "grid";
                const insumo = database.insumos.find(i => i.codigo === cod);
                actualizarInventarioYCostos(cod);

                document.getElementById("prod-codigo").value = insumo.codigo;
                document.getElementById("prod-nombre").value = insumo.nombre;
                document.getElementById("prod-unidad").value = insumo.unidad;
                document.getElementById("prod-stock").value = `${insumo.stock.toFixed(2)} ${insumo.unidad}`;
                document.getElementById("prod-costo").value = `S/. ${insumo.costoPromedio.toFixed(4)}`;

                const tbody = document.getElementById("prod-tabla-movimientos");
                tbody.innerHTML = "";
                const movs = database.movimientos.filter(m => m.insumoId === cod);
                
                movs.forEach(m => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${m.fecha}</td>
                            <td><b>${m.tipo}</b></td>
                            <td>${m.cantidad}</td>
                            <td>S/. ${m.costoTotal.toFixed(2)}</td>
                        </tr>
                    `;
                });
            });
        });
    </script>
</body>
</html>
