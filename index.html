<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GastroControl360 - Ingreso</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body style="display:block; background:#F5F7FA;"> <!-- Reseteamos flex para centrado clásico -->

    <div class="login">
        <!-- Logo temporal o marcador de posición del sistema -->
        <h1 style="font-size:28px; margin-bottom:5px;">GastroControl360</h1>
        <p>Gestión Interna de Restaurantes</p>
        
        <form id="form-login">
            <input type="text" id="usuario" placeholder="Usuario de acceso" required value="admin">
            <input type="password" id="password" placeholder="Contraseña" required value="123456">
            <button type="submit">Ingresar al Sistema</button>
        </form>
    </div>

    <script>
        document.getElementById("form-login").addEventListener("submit", (e) => {
            e.preventDefault();
            // Simulación básica de acceso rápido requerida
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
